version: '3.8'

services:
  hls-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      # AWS S3 Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=us-east-2
      - S3_BUCKET_NAME=cogito-videos
      
      # Application Configuration
      - DEBUG=true
      - VIDEOS_DIR=/app/videos
      - UPLOAD_DIR=/app/uploads
      - STATIC_DIR=/app/static
    
    volumes:
      # Persistent storage for HLS files (mapped to host directories)
      - ./docker-volumes/hls:/app/persistent/hls
      - ./docker-volumes/videos:/app/persistent/videos
      
      # Local storage directories (for fallback)
      - ./docker-volumes/local-videos:/app/videos
      - ./docker-volumes/uploads:/app/uploads
      - ./docker-volumes/static:/app/static
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped

  # Optional: React frontend service
  react-frontend:
    build:
      context: ./react-hls-player
      dockerfile: Dockerfile
    ports:
      - "8081:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    depends_on:
      - hls-server
    restart: unless-stopped

volumes:
  # Named volumes for better management
  hls_data:
    driver: local
  videos_data:
    driver: local
  uploads_data:
    driver: local
  static_data:
    driver: local
